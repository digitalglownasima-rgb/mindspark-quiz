<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MindSpark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f0fa; --ink:#1d1740; --muted:#5d5880; --card:#ffffff; --accent:#5b3df5; --accent-ink:#ffffff; --spark:#ffb62e; --line:#d9d3f0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14102b;--ink:#f0edff;--muted:#a9a3cf;--card:#1f1a42;--accent:#8c78ff;--accent-ink:#14102b;--line:#342d66}}
:root[data-theme="dark"]{--bg:#14102b;--ink:#f0edff;--muted:#a9a3cf;--card:#1f1a42;--accent:#8c78ff;--accent-ink:#14102b;--line:#342d66}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri','Segoe UI',sans-serif;line-height:1.6;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:20px 20px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-family:'Fraunces',Georgia,serif;font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.logo span{color:var(--spark)}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.lang button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.9rem;padding:4px 14px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
button:focus-visible{outline:3px solid var(--spark);outline-offset:2px}
.tag{margin:44px 0 0;color:var(--muted);font-size:1.05rem}
h1{font-size:clamp(2rem,8vw,2.8rem);line-height:1.2;margin:8px 0 14px}
.lead{font-size:1.1rem;color:var(--muted);margin:0 0 28px}
.cta{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;font:inherit;font-weight:700;font-size:1.1rem;padding:14px 28px;border-radius:14px;cursor:pointer;transition:transform .15s}
.cta:active{transform:scale(.97)}
.privacy{margin:14px 0 0;font-size:.95rem;color:var(--muted)}
.share{margin-top:48px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:22px}
.share h2{margin:0 0 4px;font-size:1.2rem}
.share p{margin:0 0 16px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions button{font:inherit;font-size:.95rem;padding:9px 18px;border-radius:10px;border:1.5px solid var(--accent);background:transparent;color:var(--ink);cursor:pointer}
.actions button:hover{background:var(--accent);color:var(--accent-ink)}
#note{margin-top:14px;min-height:1.4em;font-size:.95rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Mind<span>Spark</span></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="bn" aria-pressed="true">বাংলা</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
  </header>

  <main>
    <p class="tag" data-bn="তোমার personality আবিষ্কার করো" data-en="Discover your personality">তোমার personality আবিষ্কার করো</p>
    <h1 data-bn="তোমার Personality আসলে কেমন?" data-en="What is your personality really like?">তোমার Personality আসলে কেমন?</h1>
    <p class="lead" data-bn="৮টি সহজ প্রশ্নের উত্তর দাও এবং তোমার MindSpark personality type জেনে নাও।" data-en="Answer 8 easy questions and find your MindSpark personality type.">৮টি সহজ প্রশ্নের উত্তর দাও এবং তোমার MindSpark personality type জেনে নাও।</p>
    <button class="cta" type="button" id="start" data-bn="Quiz শুরু করো 🚀" data-en="Start the quiz 🚀">Quiz শুরু করো 🚀</button>
    <p class="privacy" data-bn="কোনো sign-up বা sensitive information প্রয়োজন নেই।" data-en="No sign-up or sensitive information needed.">কোনো sign-up বা sensitive information প্রয়োজন নেই।</p>

    <section class="share">
      <h2 data-bn="তোমার Result Share করো" data-en="Share your result">তোমার Result Share করো</h2>
      <p data-bn="বন্ধুদের জানাও MindSpark তোমার সম্পর্কে কী বলেছে!" data-en="Tell your friends what MindSpark said about you!">বন্ধুদের জানাও MindSpark তোমার সম্পর্কে কী বলেছে!</p>
      <div class="actions">
        <button type="button" id="share" data-bn="Share Result" data-en="Share Result">Share Result</button>
        <button type="button" id="retake" data-bn="আবার Quiz দাও" data-en="Retake quiz">আবার Quiz দাও</button>
        <button type="button" id="home" data-bn="হোম" data-en="Home">হোম</button>
      </div>
      <div id="note" role="status"></div>
    </section>
  </main>
</div>

<script>
(function(){
  var lang='bn';
  var msgs={
    bn:{soon:'Quiz শীঘ্রই আসছে।',none:'আগে Quiz দাও, তারপর Result Share করতে পারবে।'},
    en:{soon:'The quiz is coming soon.',none:'Take the quiz first, then you can share your result.'}
  };
  var note=document.getElementById('note');
  function setLang(l){
    lang=l;
    document.documentElement.lang=l;
    document.querySelectorAll('[data-bn]').forEach(function(el){el.textContent=el.getAttribute('data-'+l)});
    document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===l))});
    note.textContent='';
  }
  document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){setLang(b.dataset.lang)})});
  document.getElementById('start').addEventListener('click',function(){note.textContent=msgs[lang].soon});
  document.getElementById('retake').addEventListener('click',function(){note.textContent=msgs[lang].soon});
  document.getElementById('share').addEventListener('click',function(){note.textContent=msgs[lang].none});
  document.getElementById('home').addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});note.textContent=''});
})();
</script>
</body>
</html>
